<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="24" y1="16" x2="488" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141F33" />
      <stop offset="55%" stop-color="#0B111E" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="48" y1="48" x2="464" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10E89B" stop-opacity="0.72" />
      <stop offset="52%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F5B841" stop-opacity="0.72" />
    </linearGradient>
    <linearGradient id="jadeBar" x1="270" y1="118" x2="368" y2="394" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4DF7B8" />
      <stop offset="100%" stop-color="#05B879" />
    </linearGradient>
    <linearGradient id="goldApex" x1="140" y1="220" x2="392" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#10E89B" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10E89B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Squircle Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="116" fill="url(#topGlow)" />

  <!-- Subtle Inner Precision Frame -->
  <rect x="34" y="34" width="444" height="444" rx="88" stroke="url(#ringGrad)" stroke-width="6" />

  <!-- Subtle Geometric Grid Crosshairs -->
  <path d="M104 256H408M256 104V408" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="3" />

  <!-- 1st Order Precision Pillar (Platinum L-base) -->
  <rect x="128" y="246" width="54" height="128" rx="16" fill="#E2E8F0" />
  <rect x="128" y="330" width="136" height="44" rx="16" fill="#E2E8F0" />

  <!-- 2nd Order Scaled Execution Pillar (Luminous Jade) -->
  <rect x="292" y="150" width="66" height="224" rx="18" fill="url(#jadeBar)" />
  <!-- Candlestick Precision Wick -->
  <rect x="319" y="108" width="12" height="46" rx="6" fill="#4DF7B8" />
  <rect x="319" y="370" width="12" height="34" rx="6" fill="#059669" />

  <!-- Velocity Apex Trajectory Arrow (Champagne Gold) -->
  <path
    d="M142 214L244 166L284 196L378 118"
    stroke="url(#goldApex)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M332 114H382V164"
    stroke="url(#goldApex)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
